# ══════════════════════════════════════════════════════════════════════════
#  MY HOME CI — Codemagic
# ──────────────────────────────────────────────────────────────────────────
#  Le build iOS se fait ici parce qu'Xcode n'existe pas sous Windows : c'est
#  la seule voie vers TestFlight sans machine macOS.
#
#  PREREQUIS, a faire une seule fois dans l'interface Codemagic :
#
#  1. Teams > Integrations > App Store Connect
#     Ajouter une cle API App Store Connect, nommee exactement « My Home CI ASC ».
#
#  2. App Store Connect
#     L'App ID com.myhomeci.app doit exister, avec les capacites suivantes
#     activees sur l'identifiant : Push Notifications, Sign in with Apple,
#     Associated Domains. Sans elles, `xcode-project use-profiles` genere un
#     profil incompatible avec Runner.entitlements et la signature echoue avec
#     un message peu explicite du type « provisioning profile doesn't match ».
#
#  3. Environment variables (groupe « myhomeci »)
#     MAPS_API_KEY_IOS      clef Google Maps restreinte au bundle iOS
#     APP_STORE_APPLE_ID    identifiant numerique de l'app dans App Store Connect
#
#  Declenchement : pousser un tag `v1.0.0` lance la publication TestFlight.
#  Un push sur ios ou main lance seulement la verification de compilation.
#
#  VERSION FLUTTER FIGEE, jamais `stable`.
#  `stable` resout vers ce que Flutter publie le jour du build : un rebuild a
#  l'identique peut donc echouer sans qu'une ligne ait change (typiquement
#  `pod install` qui se met a exiger une cible de deploiement iOS plus haute).
#  On fige donc une version precise (3.47.0 = la stable au moment de l'audit).
#  Regle : apres un premier build vert, relever la version reellement utilisee
#  dans le log Codemagic et la figer ici ; l'aligner aussi sur le poste de dev.
#  `xcode: latest` reste une cible mouvante du meme type : le figer une fois
#  qu'un build vert a revele la version d'Xcode qui fonctionne.
# ══════════════════════════════════════════════════════════════════════════

definitions:
  scripts:
    - &get_dependencies
      name: Dependances Flutter
      script: flutter pub get

    - &write_maps_key
      name: Injection de la clef Google Maps
      script: |
        # La clef n'est pas versionnee : on l'ecrit dans un xcconfig lu par
        # Info.plist via $(MAPS_API_KEY_IOS). Sans ce fichier, la carte
        # s'affiche en gris uni sans erreur — panne silencieuse classique.
        cat > ios/Flutter/Keys.xcconfig <<EOF
        MAPS_API_KEY_IOS=$MAPS_API_KEY_IOS
        EOF
        # On chaine avec la configuration Flutter existante.
        if ! grep -q "Keys.xcconfig" ios/Flutter/Release.xcconfig; then
          echo '#include "Keys.xcconfig"' >> ios/Flutter/Release.xcconfig
        fi
        if ! grep -q "Keys.xcconfig" ios/Flutter/Debug.xcconfig; then
          echo '#include "Keys.xcconfig"' >> ios/Flutter/Debug.xcconfig
        fi

    - &pod_install
      name: CocoaPods
      script: |
        cd ios
        pod install --repo-update

workflows:

  # ── Verification de compilation, sans signature ────────────────────────
  ios-build-check:
    name: iOS Build Check
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      flutter: 3.47.0    # Fige la version : jamais 'stable' (rebuild non reproductible, cf. note en tete). A aligner sur la version d'un build vert.
      xcode: latest
      cocoapods: default
      groups:
        - myhomeci
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: ios
          include: true
        - pattern: main
          include: true
    scripts:
      - *get_dependencies
      - name: Analyse statique
        script: flutter analyze lib --no-fatal-infos
      - name: Tests
        script: flutter test || echo "⚠️ Tests en echec — build poursuivi pour diagnostic"
      - *write_maps_key
      - *pod_install
      - name: Build iOS (sans signature)
        script: flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/Runner.app
      - flutter_drive.log
    publishing:
      email:
        recipients:
          - emmanuelsakam@gmail.com
        notify:
          success: false
          failure: true

  # ── Build simulateur iOS ───────────────────────────────────────────────
  # Produit un .app exécutable dans le simulateur, sans aucune signature ni
  # compte Apple. C'est le seul moyen de faire tourner l'application et de
  # capturer des écrans iOS quand on développe sous Windows.
  ios-simulator:
    name: iOS Simulator
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      flutter: 3.47.0    # Fige la version : jamais 'stable' (rebuild non reproductible, cf. note en tete). A aligner sur la version d'un build vert.
      xcode: latest
      cocoapods: default
      groups:
        - myhomeci
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: ios
          include: true
    scripts:
      - *get_dependencies
      - *write_maps_key
      - *pod_install
      - name: Build pour le simulateur
        script: |
          # `--simulator` produit un binaire x86_64/arm64 non signé destiné au
          # simulateur. Il ne s'installe pas sur un appareil physique : c'est
          # attendu, et cela évite tout besoin de certificat.
          flutter build ios --simulator --debug
      - name: Archive du .app
        script: |
          cd build/ios/iphonesimulator
          zip -r $CM_BUILD_DIR/MyHomeCI-simulator.zip Runner.app
      - name: Capture d'ecran de demarrage
        script: |
          # Démarre un simulateur, installe l'app et capture l'écran : preuve
          # visuelle que le binaire iOS se lance réellement.
          DEVICE=$(xcrun simctl list devices available | grep -m1 "iPhone 16" | grep -oE "[0-9A-F-]{36}")
          if [ -z "$DEVICE" ]; then
            DEVICE=$(xcrun simctl list devices available | grep -m1 "iPhone" | grep -oE "[0-9A-F-]{36}")
          fi
          xcrun simctl boot "$DEVICE" || true
          sleep 20
          xcrun simctl install "$DEVICE" build/ios/iphonesimulator/Runner.app
          xcrun simctl launch "$DEVICE" com.myhomeci.app || true
          sleep 15
          xcrun simctl io "$DEVICE" screenshot $CM_BUILD_DIR/simulateur-accueil.png || true
        ignore_failure: true
    artifacts:
      - MyHomeCI-simulator.zip
      - simulateur-accueil.png
    publishing:
      email:
        recipients:
          - emmanuelsakam@gmail.com
        notify:
          success: true
          failure: true

  # ── Build signe et publication TestFlight ──────────────────────────────
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: My Home CI ASC
    environment:
      flutter: 3.47.0    # Fige la version : jamais 'stable' (rebuild non reproductible, cf. note en tete). A aligner sur la version d'un build vert.
      xcode: latest
      cocoapods: default
      groups:
        - myhomeci
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.myhomeci.app
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      - *get_dependencies
      - *write_maps_key
      - *pod_install
      - name: Numero de build incremental
        script: |
          # App Store Connect refuse un numero de build deja televerse. On
          # repart du dernier numero connu chez Apple plutot que du compteur
          # local, qui derive des qu'un build est relance.
          BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo "0")
          echo "Dernier build TestFlight : $BUILD_NUMBER"
          echo "NEW_BUILD_NUMBER=$((BUILD_NUMBER + 1))" >> $CM_ENV
      - name: Profils de signature
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --build-number=$NEW_BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # La soumission a la revue App Store reste manuelle : les metadonnees
        # (captures, description, formulaire de confidentialite) doivent etre
        # completees avant, et une soumission automatique partirait incomplete.
        submit_to_app_store: false
      email:
        recipients:
          - emmanuelsakam@gmail.com
        notify:
          success: true
          failure: true

  # ── Android : AAB signe pour Google Play ───────────────────────────────
  android-release:
    name: Android Release (AAB)
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: 3.47.0    # Fige la version : jamais 'stable' (rebuild non reproductible, cf. note en tete). A aligner sur la version d'un build vert.
      java: 17
      groups:
        - myhomeci
      android_signing:
        - my_home_ci_keystore
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      - *get_dependencies
      - name: Injection de la clef Google Maps
        script: |
          echo "MAPS_API_KEY=$MAPS_API_KEY_ANDROID" >> android/local.properties
      - name: Analyse statique
        script: flutter analyze lib --no-fatal-infos
      - name: Build App Bundle
        script: flutter build appbundle --release
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/mapping/release/mapping.txt
    publishing:
      email:
        recipients:
          - emmanuelsakam@gmail.com
