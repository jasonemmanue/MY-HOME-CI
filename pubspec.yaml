name: my_home_ci
description: "MY HOME CI - Plateforme de mise en relation locative en Cote d'Ivoire"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  smooth_page_indicator: ^1.2.0+3
  flutter_staggered_grid_view: ^0.7.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  photo_view: ^0.15.0

  # State management
  provider: ^6.1.2

  # Firebase
  firebase_core: ^3.14.0
  firebase_auth: ^5.6.0
  cloud_firestore: ^5.6.9
  firebase_storage: ^12.4.5
  firebase_messaging: ^15.2.7
  firebase_analytics: ^11.5.0
  firebase_crashlytics: ^4.3.7
  firebase_app_check: ^0.3.2+1
  cloud_functions: ^5.5.2

  # Auth sociale
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4
  crypto: ^3.0.6

  # Cartographie & geolocalisation
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # Medias
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  permission_handler: ^11.4.0
  path_provider: ^2.1.5

  # Notifications locales (affichage en premier plan)
  flutter_local_notifications: ^17.2.4

  # Reseau & stockage local
  http: ^1.2.2
  shared_preferences: ^2.3.2
  connectivity_plus: ^6.1.4

  # Utilitaires
  intl: ^0.20.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  package_info_plus: ^8.1.2
  uuid: ^4.5.1
  timeago: ^3.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  fake_cloud_firestore: ^3.1.0
  firebase_auth_mocks: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#2E7D5B"
  adaptive_icon_foreground: "assets/images/logo.png"
  min_sdk_android: 23

flutter:
  uses-material-design: true
  assets:
    - assets/images/
